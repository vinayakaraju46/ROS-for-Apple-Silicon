version: '3.8'
services:
  ros-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros-simulation-${ENV}
    networks:
        ros-simulation:
          ipv4_address: ${BASE_NET_RANGE}.4
    hostname: ros-sim.local
    environment:
      - ENV
    ports:
      - "${TTYD_PORT}:5000"
      - "${NO_VNC_PORT}:6080"
      - "${VS_CODE_PORT}:8080"
      - "${ROS_MASTER_URI_PORT}:11311"
      - "7400:7400/udp"   # Fast DDS discovery port
      - "7410:7410/udp"   # Participant data
      - "50000-50010:50000-50010/udp"  # RTPS messages (range can be expanded)
    
    stdin_open: true
    tty: true
    volumes:
      - ./config:/config



networks:
  ros-simulation:
    name: ros-simulation-${ENV}
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${BASE_NET_RANGE}.0/24
