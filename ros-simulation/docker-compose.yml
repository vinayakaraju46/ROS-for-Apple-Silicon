version: '3.8'
services:
  ros2-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2-simulation-${ENV}
    
    # network_mode: "host"
    
    environment:
      - ENV
      - RMW_IMPLEMENTATION=rmw_cyclone_dds_cpp
      - ROS_DOMAIN_ID=42
    ports:
      - "${TTYD_PORT}:5000"
      - "${NO_VNC_PORT}:6080"
      - "${VS_CODE_PORT}:8080"
      - "${ROS_MASTER_URI_PORT}:11311"
    stdin_open: true
    tty: true
    volumes:
      - ./config:/config



networks:
  ros2-simulation:
    name: ros2-simulation-${ENV}
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${BASE_NET_RANGE}.0/24
