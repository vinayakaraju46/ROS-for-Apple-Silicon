version: '3.8'
services:
  ros-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros-simulation-${ENV}
    # network_mode: "host"
    environment:
      - ENV
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    privileged: true
    ports:
      - "${TTYD_PORT}:5000"
      - "${NO_VNC_PORT}:6080"
      - "${VS_CODE_PORT}:8080"
      - "${ROS_MASTER_URI_PORT}:11311"
    
    stdin_open: true
    tty: true
    volumes:
      - ./config:/config
